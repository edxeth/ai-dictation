[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-dictation"
version = "1.1.1"
description = "AI voice dictation with local and cloud backends and a desktop GUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI Dictation" }]
dependencies = [
  "nemo_toolkit[asr]",
  "faster-whisper",
  "numpy<2.0",
  "pyaudio",
  "pyperclip",
  "webrtcvad-wheels",
  "msgpack>=1.0",
  "websockets>=15",
  "ml-dtypes==0.5.4; python_version < '3.13'",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
local-ai-dictation = "local_ai_dictation.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
