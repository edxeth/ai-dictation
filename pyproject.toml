[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-dictation"
version = "1.1.2"
description = "AI voice dictation with local and cloud backends and a desktop GUI"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "AI Dictation" }]
dependencies = [
  "kestrel==0.9.1",
  "huggingface-hub>=0.20",
  "torch>=2.4",
  "faster-whisper",
  "numpy<2.0",
  "pyaudio",
  "pyperclip",
  "webrtcvad-wheels",
  "msgpack>=1.0",
  "websockets>=15",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
local-ai-dictation = "local_ai_dictation.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "ruff==0.16.10",
    "vulture==2.16",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.vulture]
paths = ["src", "tests", "integrations", "vulture_whitelist.py"]
ignore_decorators = ["@pytest.fixture"]

[tool.deptry]
known_first_party = ["local_ai_dictation"]
optional_dependencies_dev_groups = ["test"]

[tool.deptry.per_rule_ignores]
# These runtimes are loaded with importlib only when the selected backend needs them.
DEP002 = ["kestrel", "faster-whisper", "pyperclip", "torch"]
